<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/alteregoIcon114x114.png">
    <link rel="stylesheet" href="style.css">
    <title>Alter Ego</title>
</head>
<body>
<div style="justify-content:center;display:flex;">
    <div id="main-wraper">
        <div style="position: absolute;">
            <img id="alterego-face" src="assets/face/AlterEgoFace00.png">
        </div>

        <div id="menu-right">
            <button onclick="character_start()" class="menu-button-right animated-scale">
                <img src="assets/main/icon/character.png" class="menu-button-image">
                <p class="menu-text">character</p>
            </button>
            <button onclick="encyclopedia_start()" class="menu-button-right animated-scale">
                <img src="assets/main/icon/world_view.png" class="menu-button-image">
                <p class="menu-text">WorldView</p>
            </button>
            <button onclick="alert('diagnosis!')" class="menu-button-right animated-scale">
                <img src="assets/main/icon/diagnosis.png" class="menu-button-image">
                <p class="menu-text">Diagnosis</p>
            </button>
            <button onclick="alert('help!')" class="menu-button-right animated-scale">
                <img src="assets/main/icon/help.png" class="menu-button-image">
                <p class="menu-text">HELP</p>
            </button>
            <button onclick="alert('random conversation!')" class="menu-button-right menu-random-dialog animated-scale">
                <img src="assets/main/icon/random_dialog.png" class="menu-button-image">
            </button>
        </div>

        <div id="menu-left">
            <button onclick="alert('calendar!')" class="menu-button-left animated-scale">
                <img src="assets/main/icon/calendar.png" class="menu-button-image">
                <p class="menu-text">Calendar</p>
            </button>
            <button onclick="clock_start()" class="menu-button-left animated-scale">
                <img src="assets/main/icon/clock.png" class="menu-button-image">
                <p class="menu-text" style="right: -24px;">Clock</p>
            </button>
        </div>

        <div id="clock">
            <div id="clock-number-big">
                <img id="clock-hour-1" src="assets/number/big_number/8.png" class="clock-image-big clock-image-big-left-offset">
                <img id="clock-hour-2" src="assets/number/big_number/8.png" class="clock-image-big clock-image-big-left-offset">
                <img src="assets/number/big_number/colon.png" class="clock-image-big">
                <img id="clock-minute-1" src="assets/number/big_number/8.png" class="clock-image-big clock-image-big-right-offset">
                <img id="clock-minute-2" src="assets/number/big_number/8.png" class="clock-image-big clock-image-big-right-offset">
            </div>

            <div id="clock-number-small">
                <img id="clock-year-1" src="assets/number/small_number/8.png" class="clock-number-small-1-offset">
                <img id="clock-year-2" src="assets/number/small_number/8.png" class="clock-number-small-2-offset">
                <img id="clock-year-3" src="assets/number/small_number/8.png" class="clock-number-small-3-offset">
                <img id="clock-year-4" src="assets/number/small_number/8.png" class="clock-number-small-4-offset">
                <img src="assets/number/small_number/slash.png" class="clock-number-small-5-offset">
                <img id="clock-month-1" src="assets/number/small_number/8.png" class="clock-number-small-6-offset">
                <img id="clock-month-2" src="assets/number/small_number/8.png" class="clock-number-small-7-offset">
                <img src="assets/number/small_number/slash.png" class="clock-number-small-8-offset">
                <img id="clock-day-1" src="assets/number/small_number/8.png" class="clock-number-small-9-offset">
                <img id="clock-day-2" src="assets/number/small_number/8.png" class="clock-number-small-10-offset">
            </div>

            <button onclick="clock_back()" class="clock-button-back"></button>
        </div>

        <div id="encyclopedia">
            <div id="encyclopedia-side"></div>
            <div id="encyclopedia-darker-bg"></div>
            <div id="encyclopedia-line-vertical"></div>
            <div id="encyclopedia-line-horizontal"></div>
            <div id="encyclopedia-cylinder">
                <img src="assets/main/cylinder.png" id="encyclopedia-cylinder-image">
            </div>

            <div class="encyclopedia-block-top"></div>
            <div class="encyclopedia-block-bottom"></div>

            <img src="assets/encyclopedia/chapter_w.png" id="encyclopedia-chapter-w">
            <img src="assets/encyclopedia/encyclopedia.png" id="encyclopedia-encyclopedia-text">
            <div id="encyclopedia-dr-world-encyclopedia">
                <img src="assets/encyclopedia/dr_world_encyclopedia.png">
                <p id="encyclopedia-dr-world-encyclopedia-text">Danganronpa Worldview Encyclopedia</p>
            </div>

            <div id="encyclopedia-text-container">
                <button onclick="encyclopedia_dialog(1)" class="encyclopedia-button-text"><p class="encyclopedia-text">School Introduction: Hope's Peak Academy</p><img src="assets/encyclopedia/encyclopedia_hover_thing.png" id="encyclopedia-text-1"></button>

                <button onclick="encyclopedia_dialog(14)" class="encyclopedia-button-text"><p class="encyclopedia-text">School Tour: Art Room</p><img src="assets/encyclopedia/encyclopedia_hover_thing.png" id="encyclopedia-text-14"></button>
                <button onclick="encyclopedia_dialog(15)" class="encyclopedia-button-text"><p class="encyclopedia-text">School Tour: Biology Lab</p><img src="assets/encyclopedia/encyclopedia_hover_thing.png" id="encyclopedia-text-15"></button>

                <button onclick="encyclopedia_dialog(19)" class="encyclopedia-button-text"><p class="encyclopedia-text">School Tour: Cafeteria</p><img src="assets/encyclopedia/encyclopedia_hover_thing.png" id="encyclopedia-text-19"></button>
                <button onclick="encyclopedia_dialog(20)" class="encyclopedia-button-text"><p class="encyclopedia-text">Glossary: Free Time</p><img src="assets/encyclopedia/encyclopedia_hover_thing.png" id="encyclopedia-text-20"></button>
                <button onclick="encyclopedia_dialog(21)" class="encyclopedia-button-text"><p class="encyclopedia-text">Glossary: Punishment</p><img src="assets/encyclopedia/encyclopedia_hover_thing.png" id="encyclopedia-text-21"></button>
                <button onclick="encyclopedia_dialog(22)" class="encyclopedia-button-text"><p class="encyclopedia-text">Glossary: Kuro</p><img src="assets/encyclopedia/encyclopedia_hover_thing.png" id="encyclopedia-text-22"></button>
                <button onclick="encyclopedia_dialog(23)" class="encyclopedia-button-text"><p class="encyclopedia-text">Glossary: Heretical Angel ☆ Mochi Mochi Princess</p><img src="assets/encyclopedia/encyclopedia_hover_thing.png" id="encyclopedia-text-23"></button>

                <button onclick="encyclopedia_dialog(26)" class="encyclopedia-button-text"><p class="encyclopedia-text">Glossary: Graduation</p><img src="assets/encyclopedia/encyclopedia_hover_thing.png" id="encyclopedia-text-26"></button>
                <button onclick="encyclopedia_dialog(27)" class="encyclopedia-button-text"><p class="encyclopedia-text">Glossary: Electronic Student Handbook</p><img src="assets/encyclopedia/encyclopedia_hover_thing.png" id="encyclopedia-text-27"></button>
                <button onclick="encyclopedia_dialog(28)" class="encyclopedia-button-text"><p class="encyclopedia-text">Glossary: Fenrir</p><img src="assets/encyclopedia/encyclopedia_hover_thing.png" id="encyclopedia-text-28"></button>

                <button onclick="encyclopedia_dialog(32)" class="encyclopedia-button-text"><p class="encyclopedia-text">Glossary: The Monokuma Files</p><img src="assets/encyclopedia/encyclopedia_hover_thing.png" id="encyclopedia-text-32"></button>
                <button onclick="encyclopedia_dialog(33)" class="encyclopedia-button-text"><p class="encyclopedia-text">Glossary: Classroom</p><img src="assets/encyclopedia/encyclopedia_hover_thing.png" id="encyclopedia-text-33"></button>
                <button onclick="encyclopedia_dialog(34)" class="encyclopedia-button-text"><p class="encyclopedia-text">Glossary: Super High School Level</p><img src="assets/encyclopedia/encyclopedia_hover_thing.png" id="encyclopedia-text-34"></button>
                <button onclick="encyclopedia_dialog(35)" class="encyclopedia-button-text"><p class="encyclopedia-text">Glossary: Kurei Jiwai Dai A Monjou</p><img src="assets/encyclopedia/encyclopedia_hover_thing.png" id="encyclopedia-text-35"></button>

            <button onclick="encyclopedia_back()" id="encyclopedia-button-back" class="button-back"></button>
        </div>

        <div id="character">
            <img src="assets/character/character_encyclopedia.png" id="character-top-encyclopedia-image">

            <div id="character-encyclopedia-container">
                <button onclick="character_encyclopedia(1)" id="character-button-encyclopedia-1" class="character-button-encyclopedia"><img src="assets/character/character_icon/character_1.png" id="character-button-encyclopedia-image-1"></button>
                <button onclick="character_encyclopedia(2)" id="character-button-encyclopedia-2" class="character-button-encyclopedia"><img src="assets/character/character_icon/character_2.png" id="character-button-encyclopedia-image-2"></button>
                <button onclick="character_encyclopedia(3)" id="character-button-encyclopedia-3" class="character-button-encyclopedia"><img src="assets/character/character_icon/character_3.png" id="character-button-encyclopedia-image-3"></button>
                <button onclick="character_encyclopedia(4)" id="character-button-encyclopedia-4" class="character-button-encyclopedia"><img src="assets/character/character_icon/character_4.png" id="character-button-encyclopedia-image-4"></button>
                <button onclick="character_encyclopedia(5)" id="character-button-encyclopedia-5" class="character-button-encyclopedia"><img src="assets/character/character_icon/character_5.png" id="character-button-encyclopedia-image-5"></button>
                <button onclick="character_encyclopedia(6)" id="character-button-encyclopedia-6" class="character-button-encyclopedia"><img src="assets/character/character_icon/character_6.png" id="character-button-encyclopedia-image-6"></button>
            </div>

            <div id="character-image-full-container"><img src="" id="character-image-full"></div>
            

            <button onclick="character_change(false)" id="character-char-button-next"></button>
            <button onclick="character_change(true)" id="character-char-button-back"></button>
            
            <button onclick="character_back()" id="character-button-back" class="button-back"></button>
        </div>

        <img src="assets/main/noise_1.png" id="noise" class="click-pass">

        <div id="dialog-wraper">
            <div id="dialog-box">
                <img src="assets/dialog/dialog.png">
            </div>
            <div id="dialog-container">
                <p id="dialog-text"></p>
                <span id="dialog-skip">
                    <button onclick="skipDialogFunc()" class="dialog-skip-button"></button>
                </span>
                <span id="dialog-pass">
                    <button onclick="passDialogFunc()" class="dialog-pass-button">
                        <img src="assets/dialog/dialog_skip.png" class="dialog-pass-image">
                    </button>
                </span>
                <span id="dialog-next">
                    <button onclick="nextDialogFunc()" class="dialog-next-button">
                        <img src="assets/dialog/dialog_next.png" class="dialog-next-image">
                    </button>
                </span>
            </div>
        </div>

        <div id="scroll-artifact-wraper" class="click-pass">
            <img src="assets/main/scroll_artifact.png" class="fall">
        </div>
        
        <img src="assets/main/border.png" id="border-wraper" class="click-pass">

</div>

<script src="index.js"></script>
</body>
</html>
