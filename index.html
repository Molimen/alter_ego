<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/alteregoIcon114x114.png">
    <link rel="stylesheet" href="style.css">
    <title>Alter Ego</title>
</head>
<body>
<div style="justify-content:center;display:flex;">
    <div id="main-wraper">
        <div style="position: absolute;">
            <img id="alterego-face" src="assets/face/AlterEgoFace00.png">
        </div>

        <div id="menu-right">
            <button onclick="alert('character!')" class="menu-button-right animated-scale">
                <img src="assets/main/icon/character.png" class="menu-button-image">
                <p class="menu-text">character</p>
            </button>
            <button onclick="encyclopedia_start()" class="menu-button-right animated-scale">
                <img src="assets/main/icon/world_view.png" class="menu-button-image">
                <p class="menu-text">WorldView</p>
            </button>
            <button onclick="alert('diagnosis!')" class="menu-button-right animated-scale">
                <img src="assets/main/icon/diagnosis.png" class="menu-button-image">
                <p class="menu-text">Diagnosis</p>
            </button>
            <button onclick="alert('help!')" class="menu-button-right animated-scale">
                <img src="assets/main/icon/help.png" class="menu-button-image">
                <p class="menu-text">HELP</p>
            </button>
            <button onclick="alert('random conversation!')" class="menu-button-right menu-random-dialog animated-scale">
                <img src="assets/main/icon/random_dialog.png" class="menu-button-image">
            </button>
        </div>

        <div id="menu-left">
            <button onclick="alert('calendar!')" class="menu-button-left animated-scale">
                <img src="assets/main/icon/calendar.png" class="menu-button-image">
                <p class="menu-text">Calendar</p>
            </button>
            <button onclick="clock_start()" class="menu-button-left animated-scale">
                <img src="assets/main/icon/clock.png" class="menu-button-image">
                <p class="menu-text" style="right: -24px;">Clock</p>
            </button>
        </div>

        <div id="clock">
            <div id="clock-number-big">
                <img id="clock-hour-1" src="assets/number/big_number/8.png" class="clock-image-big clock-image-big-left-offset">
                <img id="clock-hour-2" src="assets/number/big_number/8.png" class="clock-image-big clock-image-big-left-offset">
                <img src="assets/number/big_number/colon.png" class="clock-image-big">
                <img id="clock-minute-1" src="assets/number/big_number/8.png" class="clock-image-big clock-image-big-right-offset">
                <img id="clock-minute-2" src="assets/number/big_number/8.png" class="clock-image-big clock-image-big-right-offset">
            </div>

            <div id="clock-number-small">
                <img id="clock-year-1" src="assets/number/small_number/8.png" class="clock-number-small-1-offset">
                <img id="clock-year-2" src="assets/number/small_number/8.png" class="clock-number-small-2-offset">
                <img id="clock-year-3" src="assets/number/small_number/8.png" class="clock-number-small-3-offset">
                <img id="clock-year-4" src="assets/number/small_number/8.png" class="clock-number-small-4-offset">
                <img src="assets/number/small_number/slash.png" class="clock-number-small-5-offset">
                <img id="clock-month-1" src="assets/number/small_number/8.png" class="clock-number-small-6-offset">
                <img id="clock-month-2" src="assets/number/small_number/8.png" class="clock-number-small-7-offset">
                <img src="assets/number/small_number/slash.png" class="clock-number-small-8-offset">
                <img id="clock-day-1" src="assets/number/small_number/8.png" class="clock-number-small-9-offset">
                <img id="clock-day-2" src="assets/number/small_number/8.png" class="clock-number-small-10-offset">
            </div>

            <button onclick="clock_back()" class="clock-button-back"></button>
        </div>

        <div id="encyclopedia">
            <div id="encyclopedia-side"></div>
            <div id="encyclopedia-darker-bg"></div>
            <div id="encyclopedia-line-vertical"></div>
            <div id="encyclopedia-line-horizontal"></div>
            <div id="encyclopedia-cylinder">
                <img src="assets/main/cylinder.png" id="encyclopedia-cylinder-image">
            </div>

            <div class="encyclopedia-block-top"></div>
            <div class="encyclopedia-block-bottom"></div>

            <img src="assets/encyclopedia/chapter_w.png" id="encyclopedia-chapter-w">
            <img src="assets/encyclopedia/encyclopedia.png" id="encyclopedia-encyclopedia-text">
            <div id="encyclopedia-dr-world-encyclopedia">
                <img src="assets/encyclopedia/dr_world_encyclopedia.png">
                <p id="encyclopedia-dr-world-encyclopedia-text">Danganronpa Worldview Encyclopedia</p>
            </div>

            <div id="encyclopedia-text-container">

        </div>

        <img src="assets/main/noise_1.png" id="noise" class="click-pass">

        <!--Adjust the top and width to add space in corner-->
        <div id="dialog-wraper">
            <div id="dialog-box">
                <img src="assets/dialog/dialog.png">
            </div>
            <div id="dialog-container">
                <p id="dialog-text"></p>
                <span id="dialog-skip">
                    <button onclick="skipDialogFunc()" class="dialog-skip-button"></button>
                </span>
                <span id="dialog-pass">
                    <button onclick="passDialogFunc()" class="dialog-pass-button">
                        <img src="assets/dialog/dialog_skip.png" class="dialog-pass-image">
                    </button>
                </span>
                <span id="dialog-next">
                    <button onclick="nextDialogFunc()" class="dialog-next-button">
                        <img src="assets/dialog/dialog_next.png" class="dialog-next-image">
                    </button>
                </span>
            </div>
        </div>

        <div id="scroll-artifact-wraper" class="click-pass">
            <img src="assets/main/scroll_artifact.png" class="fall">

        <img src="assets/main/border.png" id="border-wraper" class="click-pass">
